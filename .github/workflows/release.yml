name: Release

# Fires when:
#   • a v* tag is pushed from the CLI  (git push origin v1.0.0)
#   • a Release is published via the GitHub UI
#   • manually triggered from the Actions tab (for testing)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

# NOTE: macOS-only build — this app uses a CoreWLAN native addon (wifi.node)
# that only compiles and runs on macOS. Windows/Linux builds are intentionally
# excluded because Wi-Fi SSID detection will not work on those platforms.

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    # Allow the built-in GITHUB_TOKEN to create/update releases
    permissions:
      contents: write

    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      # ── Checkout (pure shell — no Node action) ───────────────────────────────
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-master}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GITHUB_WORKSPACE"
        working-directory: /tmp

      # ── Node 22 via nvm (pre-installed on macos-latest) ──────────────────────
      - name: Set up Node.js 22
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          node --version
          npm --version
          # Make this Node the default for subsequent steps
          echo "$(nvm which 22 | xargs dirname)" >> "$GITHUB_PATH"

      # ── Install deps ──────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Rebuild native addon (wifi.node) for the bundled Electron ABI ────────
      - name: Rebuild native addon
        run: npm run rebuild

      # ── Build TypeScript + renderer ───────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── Package DMG (unsigned) ────────────────────────────────────────────────
      - name: Package DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      # ── Resolve the tag name (works for all three trigger types) ──────────────
      - name: Resolve tag name
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── Upload DMG as a workflow artifact ─────────────────────────────────────
      - name: Upload artifact
        run: |
          DMG=$(ls release/*.dmg | head -1)
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename $DMG)" >> "$GITHUB_OUTPUT"
        id: dmg

      - name: Store DMG artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DontAskWhereIAm-${{ steps.ref.outputs.name }}-mac
          path: DontAskWhereIAm/release/*.dmg
          if-no-files-found: error

      # ── Create/update the GitHub Release and attach the DMG ───────────────────
      # Uses the gh CLI (pre-installed on all GitHub-hosted runners, no Node dep)
      - name: Attach DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.name }}
        run: |
          DMG=$(ls release/*.dmg | head -1)
          PRERELEASE=""
          [[ "$TAG" == *"-"* ]] && PRERELEASE="--prerelease"

          # Create release if it doesn't exist yet; update if it does
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "DontAskWhereIAm $TAG" \
            --notes "## DontAskWhereIAm $TAG

          ### Install
          1. Download the \`.dmg\` below and open it.
          2. Drag **DontAskWhereIAm** to your Applications folder.
          3. On first launch go to **System Settings → Privacy & Security → Location Services** and enable it for DontAskWhereIAm.
          4. If macOS blocks the app (unsigned build), run:
             \`\`\`bash
             xattr -cr /Applications/DontAskWhereIAm.app
             \`\`\`" \
            $PRERELEASE \
            "$DMG" 2>/dev/null || \
          gh release upload "$TAG" "$DMG" \
            --repo "${{ github.repository }}" \
            --clobber
