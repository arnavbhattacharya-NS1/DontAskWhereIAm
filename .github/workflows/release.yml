name: Release

# Fires when:
#   • a v* tag is pushed from the CLI  (git push origin v1.0.0)
#   • a Release is published via the GitHub UI
#   • manually triggered from the Actions tab (for testing)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

# NOTE: macOS-only build.
# The app uses a CoreWLAN native addon (wifi.node) compiled against Apple
# frameworks. It cannot be cross-compiled for Windows or Linux runners.
# Wi-Fi SSID detection on Windows and Linux uses netsh / nmcli respectively
# (no native addon needed) and works at runtime on those platforms — but the
# packaged build must be produced on the matching OS runner.

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS DMG ──────────────────────────────────────────────────────────────
  build-mac:
    name: macOS DMG
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'DontAskWhereIAm/package-lock.json'

      - name: Install dependencies
        # postinstall.js only sets up the Electron binary — it does NOT build TS
        run: npm ci

      - name: Rebuild native Wi-Fi addon (CoreWLAN)
        run: npm run rebuild

      - name: Verify wifi.node was built
        run: |
          if [ ! -f native/wifi/build/Release/wifi.node ]; then
            echo "❌ wifi.node not found — rebuild failed"
            exit 1
          fi
          echo "✅ wifi.node found: $(ls -lh native/wifi/build/Release/wifi.node)"

      - name: Build TypeScript + renderer
        run: npm run build

      - name: Verify dist was produced
        run: |
          if [ ! -f dist/main/main.js ]; then
            echo "❌ dist/main/main.js not found — build failed"
            exit 1
          fi
          echo "✅ dist/main/main.js found"

      - name: Package DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --do-not-rebuild: we already rebuilt native deps above; prevents
        # electron-builder from running its own rebuild and overwriting wifi.node
        run: npx electron-builder --mac dmg --publish always --do-not-rebuild

  # ── Windows NSIS installer ─────────────────────────────────────────────────
  build-win:
    name: Windows installer
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'DontAskWhereIAm/package-lock.json'

      - name: Install dependencies
        # Skip postinstall (electron-rebuild) — no native addon needed on Windows
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

  # ── Linux AppImage ─────────────────────────────────────────────────────────
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'DontAskWhereIAm/package-lock.json'

      - name: Install system dependencies for electron-builder
        run: sudo apt-get install -y rpm

      - name: Install dependencies
        # Skip postinstall (electron-rebuild) — no native addon needed on Linux
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish always
