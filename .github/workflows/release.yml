name: Release

# Fires when:
#   • a v* tag is pushed from the CLI  (git push origin v1.0.0)
#   • a Release is published via the GitHub UI
#   • manually triggered from the Actions tab (for testing)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

# NOTE: macOS-only build — this app uses a CoreWLAN native addon (wifi.node)
# that only compiles and runs on macOS. Windows/Linux builds are intentionally
# excluded because Wi-Fi SSID detection will not work on those platforms.

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── Node (22 LTS) ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          # path is relative to repo root, not working-directory
          cache-dependency-path: 'DontAskWhereIAm/package-lock.json'

      # ── Install deps ──────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Rebuild native addon (wifi.node) for the bundled Electron ABI ────────
      - name: Rebuild native addon
        run: npm run rebuild

      # ── Build TypeScript + renderer ───────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── Package DMG (unsigned — no Apple Developer cert required) ────────────
      - name: Package DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      # ── Derive ref name for workflow_dispatch (tag input) or tag/release push ─
      - name: Resolve ref name
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── Upload DMG as a workflow artifact ─────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DontAskWhereIAm-${{ steps.ref.outputs.name }}-mac
          path: DontAskWhereIAm/release/*.dmg
          if-no-files-found: error

      # ── Attach DMG to the GitHub Release ──────────────────────────────────────
      - name: Attach DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.name }}
          name: DontAskWhereIAm ${{ steps.ref.outputs.name }}
          body: |
            ## DontAskWhereIAm ${{ steps.ref.outputs.name }}

            ### Install
            1. Download the `.dmg` below and open it.
            2. Drag **DontAskWhereIAm** to your Applications folder.
            3. On first launch go to **System Settings → Privacy & Security → Location Services** and enable it for DontAskWhereIAm.
            4. If macOS blocks the app (unsigned build), run:
               ```bash
               xattr -cr /Applications/DontAskWhereIAm.app
               ```
          draft: false
          prerelease: ${{ contains(steps.ref.outputs.name, '-') }}
          files: DontAskWhereIAm/release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
