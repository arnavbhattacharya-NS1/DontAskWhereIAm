name: Release

# Runs on:
#   • every push to master  (builds + publishes automatically)
#   • manual runs from the Actions tab  ("Run workflow" button)
on:
  push:
    branches:
      - master
  workflow_dispatch:

# NOTE: The macOS build uses a CoreWLAN native addon (wifi.node) compiled
# against Apple frameworks, so it can't be cross-compiled — each platform's
# package must be produced on its matching OS runner. Wi-Fi detection on
# Windows/Linux uses netsh / nmcli at runtime (no native addon needed).

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS DMG ──────────────────────────────────────────────────────────────
  build-mac:
    name: macOS DMG
    runs-on: macos-latest
    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native Wi-Fi addon (CoreWLAN)
        run: npm run rebuild

      - name: Verify wifi.node was built
        run: |
          if [ ! -f native/wifi/build/Release/wifi.node ]; then
            echo "❌ wifi.node not found — rebuild failed"
            exit 1
          fi
          echo "✅ wifi.node found: $(ls -lh native/wifi/build/Release/wifi.node)"

      - name: Build TypeScript + renderer
        run: npm run build

      - name: Verify dist was produced
        run: |
          if [ ! -f dist/main/main.js ]; then
            echo "❌ dist/main/main.js not found — build failed"
            exit 1
          fi
          echo "✅ dist/main/main.js found"

      - name: Package DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --do-not-rebuild: we already built wifi.node above; stops electron-builder
        # from running its own rebuild and overwriting it
        run: npx electron-builder --mac dmg --publish always --do-not-rebuild

  # ── Windows NSIS installer ─────────────────────────────────────────────────
  build-win:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true

      - name: Install dependencies
        # --ignore-scripts skips postinstall (electron-rebuild) — no native addon on Windows
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

  # ── Linux AppImage ─────────────────────────────────────────────────────────
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DontAskWhereIAm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true

      - name: Install system dependencies for electron-builder
        working-directory: '.'
        run: sudo apt-get install -y rpm

      - name: Install dependencies
        # --ignore-scripts skips postinstall (electron-rebuild) — no native addon on Linux
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish always
