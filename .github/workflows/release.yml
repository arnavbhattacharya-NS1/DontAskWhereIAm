name: Release

# Runs on:
#   • every push to master  (builds + publishes automatically)
#   • manual runs from the Actions tab  ("Run workflow" button)
on:
  push:
    branches:
      - master
  workflow_dispatch:

# NOTE: The macOS build uses a CoreWLAN native addon (wifi.node) compiled
# against Apple frameworks, so it can't be cross-compiled — each platform's
# package must be produced on its matching OS runner. Wi-Fi detection on
# Windows/Linux uses netsh / nmcli at runtime (no native addon needed).

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS DMG ──────────────────────────────────────────────────────────────
  build-mac:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build native Wi-Fi addon (CoreWLAN)
        run: |
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          echo "Electron version: $ELECTRON_VERSION"
          npx node-gyp rebuild \
            --target=$ELECTRON_VERSION \
            --arch=arm64 \
            --dist-url=https://electronjs.org/headers \
            --directory=native/wifi

      - name: Verify wifi.node was built
        run: |
          if [ ! -f native/wifi/build/Release/wifi.node ]; then
            echo "❌ wifi.node not found — build failed"
            ls -la native/wifi/build/Release/ 2>/dev/null || echo "  (Release dir does not exist)"
            exit 1
          fi
          echo "✅ wifi.node found: $(ls -lh native/wifi/build/Release/wifi.node)"

      - name: Build TypeScript + renderer
        run: npm run build

      - name: Verify dist was produced
        run: |
          if [ ! -f dist/main/main.js ]; then
            echo "❌ dist/main/main.js not found — build failed"
            exit 1
          fi
          echo "✅ dist/main/main.js found"

      - name: Package DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --publish always

  # ── Windows NSIS installer ─────────────────────────────────────────────────
  build-win:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

  # ── Linux AppImage ─────────────────────────────────────────────────────────
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install system dependencies for electron-builder
        run: sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish always
